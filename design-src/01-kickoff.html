<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:#05070a;font-family:'Space Grotesk',sans-serif;color:#fff}
/* atmosphere */
.glow{position:absolute;inset:0;background:
  radial-gradient(680px 520px at 72% 30%, rgba(57,255,20,.34), transparent 60%),
  radial-gradient(520px 520px at 20% 78%, rgba(0,170,255,.16), transparent 62%);}
.streak{position:absolute;top:-200px;left:-200px;width:1700px;height:520px;transform:rotate(-32deg);
  background:linear-gradient(90deg,transparent,rgba(57,255,20,.0) 20%,rgba(57,255,20,.85),rgba(255,255,255,.95),rgba(57,255,20,.85),transparent 80%);
  filter:blur(2px);opacity:.9;mix-blend-mode:screen}
.grid{position:absolute;inset:0;opacity:.10;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:54px 54px;-webkit-mask-image:radial-gradient(circle at 60% 40%,#000,transparent 75%)}
/* skyline */
.sky{position:absolute;left:0;right:0;bottom:0;height:360px;
  background:linear-gradient(180deg,transparent,rgba(5,7,10,.6) 40%,#05070a);}
svg.city{position:absolute;left:0;right:0;bottom:120px;width:1080px;opacity:.55}
/* content */
.kick{position:absolute;top:86px;left:88px;display:flex;align-items:center;gap:14px;
  font-weight:600;letter-spacing:6px;font-size:21px;color:#bdeuff;color:#9affc0;text-transform:uppercase}
.kick .pip{width:13px;height:13px;border-radius:50%;background:#39ff14;box-shadow:0 0 18px #39ff14}
h1{position:absolute;top:430px;left:80px;font-family:'Anton';font-weight:400;font-size:300px;line-height:.8;
  letter-spacing:-6px;color:#fff;text-shadow:0 0 60px rgba(57,255,20,.45)}
h1 .o{color:transparent;-webkit-text-stroke:3px #39ff14}
.sub{position:absolute;top:760px;left:88px;font-size:40px;font-weight:600;letter-spacing:.5px}
.sub b{color:#39ff14}
.meta{position:absolute;left:88px;bottom:150px;font-size:26px;color:#cfe9cf;font-weight:500;letter-spacing:1px}
.url{position:absolute;left:88px;bottom:96px;display:inline-flex;align-items:center;gap:12px;
  font-size:25px;font-weight:700;color:#04210a;background:#39ff14;padding:14px 26px;border-radius:14px;box-shadow:0 10px 40px rgba(57,255,20,.4)}
.badge{position:absolute;right:80px;top:84px;border:1.5px solid rgba(57,255,20,.5);border-radius:999px;
  padding:12px 22px;font-size:18px;letter-spacing:2px;color:#9affc0;text-transform:uppercase;background:rgba(57,255,20,.06)}
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div><div class="streak"></div>
  <svg class="city" viewBox="0 0 1080 240" preserveAspectRatio="none"><g fill="#0c160c">
   <rect x="20" y="120" width="70" height="120"/><rect x="100" y="80" width="54" height="160"/><rect x="165" y="140" width="80" height="100"/><rect x="255" y="60" width="46" height="180"/><rect x="312" y="100" width="92" height="140"/><rect x="416" y="30" width="40" height="210"/><rect x="466" y="90" width="78" height="150"/><rect x="556" y="120" width="60" height="120"/><rect x="626" y="70" width="50" height="170"/><rect x="686" y="110" width="96" height="130"/><rect x="792" y="50" width="44" height="190"/><rect x="846" y="130" width="74" height="110"/><rect x="930" y="92" width="60" height="148"/><rect x="998" y="140" width="62" height="100"/>
  </g></svg>
  <div class="sky"></div>
  <div class="kick"><span class="pip"></span> June 11 · World Cup 2026 · New York</div>
  <div class="badge">YourScene</div>
  <h1>KICK<span class="o">OFF</span></h1>
  <div class="sub">The World Cup is <b>live in NYC.</b></div>
  <div class="meta">Find where the energy is — right now.</div>
  <div class="url">▸ yourscene.netlify.app</div>
</body></html>
