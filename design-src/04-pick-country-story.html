<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;background:#06090c;font-family:'Space Grotesk',sans-serif;color:#fff;text-align:center}
.glow{position:absolute;inset:0;background:radial-gradient(620px 620px at 50% 16%,rgba(57,255,20,.26),transparent 60%),radial-gradient(560px 560px at 50% 92%,rgba(0,150,255,.12),transparent 60%)}
.kick{position:absolute;top:210px;left:0;right:0;font-weight:600;letter-spacing:6px;font-size:26px;color:#9affc0;text-transform:uppercase}
h1{position:absolute;top:280px;left:0;right:0;font-family:'Anton';font-size:150px;line-height:.86;letter-spacing:-3px}
h1 em{font-style:normal;color:#39ff14}
.q{position:absolute;top:640px;left:0;right:0;font-size:40px;color:#c7d6c7;font-weight:500}
.flags{position:absolute;top:790px;left:90px;right:90px;display:flex;flex-wrap:wrap;justify-content:center;gap:26px}
.flag{width:158px;height:158px;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(57,255,20,.14),rgba(255,255,255,.03));border:1.5px solid rgba(57,255,20,.4);
  display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:54px;letter-spacing:1px;color:#eafff0;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.poll{position:absolute;top:1330px;left:140px;right:140px;height:120px;border:2px dashed rgba(57,255,20,.45);border-radius:24px;
  display:flex;align-items:center;justify-content:center;color:rgba(57,255,20,.7);font-weight:600;letter-spacing:2px;font-size:24px}
.url{position:absolute;left:0;right:0;bottom:230px;font-size:34px;font-weight:700}
.url em{color:#39ff14;font-style:normal}
.tagline{position:absolute;left:0;right:0;bottom:170px;font-size:26px;color:#8da08d;letter-spacing:1px}
</style></head>
<body>
<div class="glow"></div>
<div class="kick">⚽ World Cup 2026 · NYC</div>
<h1>PICK YOUR<br><em>COUNTRY</em></h1>
<div class="q">Who are you repping this summer?</div>
<div class="flags">
  <div class="flag">MEX</div><div class="flag">USA</div><div class="flag">ENG</div>
  <div class="flag">ARG</div><div class="flag">BRA</div><div class="flag">POR</div>
</div>
<div class="poll">▼ add your poll sticker here ▼</div>
<div class="url">Find your crowd → <em>yourscene.netlify.app</em></div>
<div class="tagline">Feel the crowd. Find your scene.</div>
</body></html>
