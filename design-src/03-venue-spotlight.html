<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:#08100a;font-family:'Space Grotesk',sans-serif;color:#fff}
/* image panel (placeholder) top 58% */
.photo{position:absolute;top:0;left:0;right:0;height:780px;
  background:linear-gradient(135deg,#123d1a,#06140a 70%),radial-gradient(500px 400px at 70% 30%,rgba(57,255,20,.35),transparent 60%);}
.photo:after{content:"[ DROP VENUE PHOTO HERE ]";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.22);font-weight:600;letter-spacing:3px;font-size:24px}
.fade{position:absolute;top:560px;left:0;right:0;height:300px;background:linear-gradient(180deg,transparent,#08100a)}
.tag{position:absolute;top:62px;left:62px;background:#39ff14;color:#04210a;font-weight:700;letter-spacing:3px;font-size:20px;padding:11px 20px;border-radius:10px;text-transform:uppercase}
.live{position:absolute;top:62px;right:62px;display:flex;align-items:center;gap:11px;background:rgba(0,0,0,.45);border:1px solid rgba(57,255,20,.5);
  padding:11px 20px;border-radius:999px;font-weight:600;letter-spacing:2px;font-size:19px;color:#9affc0;text-transform:uppercase}
.live .pip{width:13px;height:13px;border-radius:50%;background:#39ff14;box-shadow:0 0 16px #39ff14}
.name{position:absolute;top:740px;left:62px;right:62px;font-family:'Anton';font-size:118px;line-height:.86;letter-spacing:-2px}
.hood{position:absolute;top:980px;left:64px;font-size:30px;color:#9affc0;font-weight:600;letter-spacing:1px}
.desc{position:absolute;top:1040px;left:64px;right:62px;font-size:30px;color:#c7d6c7;font-weight:500;line-height:1.35}
.foot{position:absolute;left:62px;bottom:70px;right:62px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:28px}
.brand .pip{width:14px;height:14px;border-radius:50%;background:#39ff14;box-shadow:0 0 14px #39ff14}
.handle{font-size:25px;color:#8da08d;font-weight:500}
</style></head>
<body>
<div class="photo"></div><div class="fade"></div>
<div class="tag">Featured Scene</div>
<div class="live"><span class="pip"></span> Buzzing</div>
<div class="name">[ VENUE NAME ]</div>
<div class="hood">[ NEIGHBORHOOD ] · NYC</div>
<div class="desc">[ one-line hook — what makes this the spot for the match ]</div>
<div class="foot"><div class="brand"><span class="pip"></span> YourScene</div><div class="handle">[ @venuehandle ]</div></div>
</body></html>
